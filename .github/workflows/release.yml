name: Release

on:
  push:
    tags: ["v*"]

# Releases are staged through npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
# A maintainer approves the staged version on npmjs.com (Staged Packages) or with `npm stage approve`.
# The trusted publisher must be configured for this package on npmjs.com first; provenance is automatic.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm stage publish --access public
