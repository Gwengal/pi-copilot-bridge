name: Release

on:
  push:
    tags: ["v*"]

# Publishing uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
# The trusted publisher must be configured for this package on npmjs.com first.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm publish --provenance --access public
